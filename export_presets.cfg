[runnable_presets]

"Windows Desktop"="Windows Release"
"Web"="Web"

[preset.2]

name="Web"
platform="Web"
runnable=true
custom_features="shared_web"
export_filter="all_resources"
include_filter="CHANGELOG.md,assets/fonts/OFL.txt,assets/fonts/font_manifest.json"
exclude_filter="src/*,tests/*,tools/*,release/*,artifacts/*,content/*,platform/web/*,assets/audio/*,assets/characters/*,assets/combat/*,assets/ui/*,assets/internal_original/th*/*,assets/internal_original/mappings/*,assets/internal_original/base/scenes/*,assets/internal_original/base/portraits/*"
export_path="artifacts/web/index.html"
script_export_mode=2

[preset.2.options]

variant/extensions_support=false
variant/thread_support=true
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/custom_html_shell="res://platform/web/shell.html"
html/export_icon=true
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false
dotnet/include_scripts_content=false
dotnet/include_debug_symbols=false

