<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Touhou / WebGPU rendering experiment</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101a21;color:#e8e9df}body{max-width:1280px;margin:24px auto;padding:0 16px}h1{font-size:24px;margin-bottom:8px}.notice{color:#b8c9cc;line-height:1.7}nav{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}button{font:inherit;border:1px solid #69817f;background:#203a3b;color:#fff;padding:12px 18px;border-radius:6px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}#surface{width:100%;aspect-ratio:16/9;background:#091416;border:1px solid #40535a}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}#status{white-space:pre-wrap;overflow-wrap:anywhere;color:#d7c895;line-height:1.6}pre{max-height:360px;overflow:auto;background:#0b141b;padding:16px;white-space:pre-wrap;font-size:13px}a{color:#b0d7d7}
</style>
</head>
<body>
<h1>WebGPU / WebGL 2 本地绘制对照</h1>
<p class="notice">仅渲染实验，不是新游戏版本，也不是 C# 战斗性能验收。使用仓库原有妖精贴图；相同 1,000 个精灵、单批实例绘制、1280×720 内部分辨率。无需共享内存。</p>
<nav><button id="gpu">WebGPU 优先</button><button id="gl">WebGL 2 对照</button><button id="compare">测量两种后端</button><button id="loss">测试设备丢失回退</button></nav>
<p id="status" role="status">正在检查真实图形设备……</p>
<div id="surface"></div>
<pre id="report">CPU 准备 / 提交耗时不是 GPU 耗时；requestAnimationFrame 速率不是完整游戏 FPS。</pre>
<script type="module" src="/lab.mjs"></script>
</body>
</html>
